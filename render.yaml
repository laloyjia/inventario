# render.yaml — Blueprint de despliegue para PanolERP
# Con esto Render crea el Web Service + la base de datos PostgreSQL de una sola vez.
# Uso: en Render -> New -> Blueprint -> conecta el repo laloyjia/inventario.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: panolerp
    runtime: python
    plan: free
    region: oregon            # cámbialo si prefieres otra región
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      # Conexión a la base de datos: se enlaza automáticamente a la DB de abajo
      - key: DATABASE_URL
        fromDatabase:
          name: panolerp-db
          property: connectionString
      # Secretos: Render los genera aleatorios y seguros al crear el Blueprint
      - key: PANOL_SECRET_KEY
        generateValue: true
      - key: PANOL_SYNC_TOKEN
        generateValue: true
      # Configuración de producción
      - key: PANOL_NODO
        value: admin_central
      - key: FORCE_HTTPS
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.10"
      # Respaldo automático interno + correo. Ajusta estos valores en el panel
      # de Render (Environment). sync:false = no se sobreescriben en cada deploy.
      - key: TZ
        value: "America/Santiago"
      - key: BACKUP_AUTO
        value: "1"
      - key: BACKUP_HORA
        value: "7"
      - key: BACKUP_DIAS
        value: "mon-sun"
      # Correo saliente (SMTP). Rellena estos en Render, NO aquí (son secretos):
      - key: SMTP_HOST
        sync: false          # ej. smtp.gmail.com
      - key: SMTP_PORT
        sync: false          # ej. 587
      - key: SMTP_USER
        sync: false          # tu correo emisor
      - key: SMTP_PASS
        sync: false          # contraseña de aplicación (16 caracteres)
      - key: SMTP_FROM
        sync: false          # opcional; por defecto usa SMTP_USER
      - key: ALERT_EMAIL
        sync: false          # destino de respaldos y avisos

databases:
  - name: panolerp-db
    plan: free
    region: oregon            # debe coincidir con la región del web service
    databaseName: panolerp
    user: panolerp
